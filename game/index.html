<html lang="en">
<head>

  <title>Vermilion Bay — Low Tide</title>

    <div id="mission" class="panel"></div><div id="status" class="panel"></div>
    <div id="dispatch" class="panel"></div><div id="minimap" class="panel"></div>
    <div id="vehicle" class="panel"></div><div id="dialogue" class="panel"></div>
    <div id="radio" class="panel"></div><div id="weapons" class="panel"></div>
